<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trading Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
    background: #f5f5f7;
    color: #1d1d1f;
    font-size: 14px;
  }

  .header {
    background: rgba(255,255,255,0.85);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid #e5e5e7;
    padding: 16px 32px;
    position: sticky;
    top: 0;
    z-index: 100;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .header h1 { font-size: 18px; font-weight: 700; }
  .header-sub { font-size: 12px; color: #6e6e73; margin-top: 2px; }

  .header-right { display: flex; align-items: center; gap: 12px; }

  .live { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #34c759; font-weight: 600; }
  .live-dot { width: 7px; height: 7px; border-radius: 50%; background: #34c759; animation: blink 2s infinite; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.4} }

  .btn {
    background: #0071e3;
    color: white;
    border: none;
    padding: 8px 16px;
    border-radius: 980px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  .btn:hover { background: #0077ed; }

  .container { max-width: 1100px; margin: 0 auto; padding: 24px 20px; }

  /* Stats */
  .stats { display: grid; grid-template-columns: repeat(6,1fr); gap: 12px; margin-bottom: 16px; }
  @media(max-width:900px){ .stats { grid-template-columns: repeat(3,1fr); } }
  @media(max-width:500px){ .stats { grid-template-columns: repeat(2,1fr); } }

  .stat {
    background: white;
    border-radius: 16px;
    padding: 16px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  }
  .stat-lbl { font-size: 11px; color: #6e6e73; font-weight: 500; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.3px; }
  .stat-val { font-size: 22px; font-weight: 700; letter-spacing: -0.5px; }
  .stat-val.g { color: #34c759; }
  .stat-val.r { color: #ff3b30; }
  .stat-val.b { color: #0071e3; }
  .stat-sub { font-size: 11px; color: #6e6e73; margin-top: 4px; }

  /* Card */
  .card {
    background: white;
    border-radius: 18px;
    padding: 22px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    margin-bottom: 14px;
  }

  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }

  .card-title { font-size: 15px; font-weight: 700; }

  /* Tabs */
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; }
  .tab {
    padding: 5px 13px;
    border-radius: 980px;
    border: 1px solid #e5e5e7;
    background: #f5f5f7;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    color: #6e6e73;
    transition: all 0.15s;
  }
  .tab.on { background: #0071e3; color: white; border-color: transparent; }

  .type-tabs { display: flex; gap: 6px; margin-bottom: 14px; }
  .type-tab {
    padding: 5px 13px;
    border-radius: 980px;
    border: 1px solid #e5e5e7;
    background: #f5f5f7;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    color: #6e6e73;
  }
  .type-tab.on { background: #1d1d1f; color: white; border-color: transparent; }

  .chart-wrap { height: 200px; }

  /* Calendar */
  .cal-nav { display: flex; align-items: center; gap: 10px; }
  .cal-nav-btn {
    width: 28px; height: 28px;
    border-radius: 50%;
    border: 1px solid #e5e5e7;
    background: #f5f5f7;
    cursor: pointer;
    font-size: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #1d1d1f;
  }
  .cal-nav-btn:hover { background: #0071e3; color: white; border-color: transparent; }
  .cal-month-lbl { font-size: 14px; font-weight: 700; min-width: 140px; text-align: center; }

  .cal-grid { display: grid; grid-template-columns: repeat(7,1fr); gap: 4px; margin-top: 12px; }
  .cal-hdr { text-align: center; font-size: 11px; color: #6e6e73; font-weight: 600; padding: 6px 0; }
  .cal-day {
    aspect-ratio: 1;
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    border: 1px solid transparent;
    transition: all 0.15s;
  }
  .cal-day.empty { visibility: hidden; }
  .cal-day.today { border: 1.5px solid #0071e3; }
  .cal-day.win { background: rgba(52,199,89,0.1); }
  .cal-day.win:hover { background: rgba(52,199,89,0.18); }
  .cal-day.loss { background: rgba(255,59,48,0.08); }
  .cal-day.loss:hover { background: rgba(255,59,48,0.14); }
  .cal-day:hover { transform: scale(1.07); }
  .day-num { font-size: 12px; }
  .day-pnl { font-size: 9px; font-weight: 700; }
  .win .day-pnl { color: #34c759; }
  .loss .day-pnl { color: #ff3b30; }

  /* Positions */
  .pos-item {
    border: 1px solid #e5e5e7;
    border-radius: 14px;
    margin-bottom: 10px;
    overflow: hidden;
  }

  .pos-top {
    padding: 14px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    cursor: pointer;
    transition: background 0.15s;
  }
  .pos-top:hover { background: #f9f9fb; }

  .pos-left { display: flex; align-items: center; gap: 10px; }
  .pos-name { font-size: 15px; font-weight: 700; }
  .dir-tag {
    font-size: 11px;
    font-weight: 700;
    padding: 2px 9px;
    border-radius: 980px;
  }
  .dir-tag.long { background: rgba(52,199,89,0.1); color: #34c759; }
  .dir-tag.short { background: rgba(255,59,48,0.1); color: #ff3b30; }

  .pos-pnl { font-size: 18px; font-weight: 700; }
  .pos-pnl.g { color: #34c759; }
  .pos-pnl.r { color: #ff3b30; }

  .pos-body {
    display: none;
    padding: 0 16px 16px;
    border-top: 1px solid #e5e5e7;
  }
  .pos-item.open .pos-body { display: block; }

  .pos-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap: 12px;
    margin-top: 14px;
  }

  .pos-meta-lbl { font-size: 10px; color: #6e6e73; font-weight: 600; text-transform: uppercase; letter-spacing: 0.3px; }
  .pos-meta-val { font-size: 13px; font-weight: 700; margin-top: 3px; }

  .chevron { color: #6e6e73; font-size: 11px; transition: transform 0.25s; }
  .pos-item.open .chevron { transform: rotate(180deg); }

  /* Trades */
  .trade-item {
    border: 1px solid #e5e5e7;
    border-radius: 14px;
    margin-bottom: 8px;
    overflow: hidden;
  }

  .trade-top {
    padding: 12px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    cursor: pointer;
    transition: background 0.15s;
  }
  .trade-top:hover { background: #f9f9fb; }

  .trade-left { display: flex; align-items: center; gap: 8px; }
  .trade-name { font-size: 14px; font-weight: 700; }
  .tag {
    font-size: 10px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 980px;
  }
  .tag.long { background: rgba(52,199,89,0.1); color: #34c759; }
  .tag.short { background: rgba(255,59,48,0.1); color: #ff3b30; }
  .tag.open { background: rgba(255,149,0,0.1); color: #ff9500; }
  .tag.win { background: rgba(52,199,89,0.1); color: #34c759; }
  .tag.loss { background: rgba(255,59,48,0.1); color: #ff3b30; }

  .trade-right { display: flex; align-items: center; gap: 10px; }
  .trade-pnl { font-size: 14px; font-weight: 700; }
  .trade-pnl.g { color: #34c759; }
  .trade-pnl.r { color: #ff3b30; }

  .trade-body {
    display: none;
    padding: 0 16px 14px;
    border-top: 1px solid #e5e5e7;
  }
  .trade-item.open .trade-body { display: block; }

  .info-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
    gap: 12px;
    margin-top: 12px;
  }
  .info-lbl { font-size: 10px; color: #6e6e73; font-weight: 600; text-transform: uppercase; letter-spacing: 0.3px; }
  .info-val { font-size: 13px; font-weight: 700; margin-top: 3px; }

  .events { margin-top: 12px; }
  .events-lbl { font-size: 10px; color: #6e6e73; font-weight: 600; text-transform: uppercase; letter-spacing: 0.3px; margin-bottom: 8px; }
  .event {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 10px;
    border-radius: 9px;
    background: #f5f5f7;
    margin-bottom: 5px;
    font-size: 12px;
  }
  .e-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .e-dot.tp { background: #34c759; }
  .e-dot.sl { background: #ff3b30; }
  .e-dot.be { background: #0071e3; }
  .e-dot.def { background: #6e6e73; }
  .e-type { font-weight: 700; min-width: 110px; }
  .e-price { color: #6e6e73; flex: 1; }
  .e-pnl { font-weight: 700; }
  .e-pnl.g { color: #34c759; }
  .e-pnl.r { color: #ff3b30; }
  .e-time { color: #6e6e73; font-size: 11px; }

  /* Awards */
  .awards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
  .award {
    border-radius: 14px;
    padding: 16px;
    border: 1px solid #e5e5e7;
  }
  .award.gold { background: rgba(255,214,10,0.06); border-color: rgba(255,214,10,0.3); }
  .award.silver { background: rgba(174,174,178,0.08); border-color: rgba(174,174,178,0.25); }
  .award.worst { background: rgba(255,59,48,0.05); border-color: rgba(255,59,48,0.15); }
  .award.avg { background: rgba(0,113,227,0.05); border-color: rgba(0,113,227,0.15); }
  .award-icon { font-size: 20px; margin-bottom: 6px; }
  .award-lbl { font-size: 10px; color: #6e6e73; font-weight: 600; text-transform: uppercase; letter-spacing: 0.3px; margin-bottom: 4px; }
  .award-name { font-size: 20px; font-weight: 800; margin-bottom: 3px; }
  .award-val { font-size: 15px; font-weight: 700; }
  .award-val.g { color: #34c759; }
  .award-val.r { color: #ff3b30; }
  .award-val.b { color: #0071e3; }
  .award-meta { font-size: 11px; color: #6e6e73; margin-top: 4px; }

  .empty { text-align: center; color: #6e6e73; padding: 28px; font-size: 13px; }

  /* Modal */
  .overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.3);
    backdrop-filter: blur(6px);
    z-index: 200;
    align-items: center;
    justify-content: center;
  }
  .overlay.show { display: flex; }
  .modal {
    background: white;
    border-radius: 20px;
    padding: 24px;
    max-width: 420px;
    width: 90%;
    box-shadow: 0 20px 60px rgba(0,0,0,0.15);
    position: relative;
  }
  .modal-title { font-size: 17px; font-weight: 700; margin-bottom: 14px; }
  .modal-close {
    position: absolute; top: 14px; right: 14px;
    width: 26px; height: 26px;
    border-radius: 50%;
    background: #f5f5f7;
    border: 1px solid #e5e5e7;
    cursor: pointer;
    font-size: 12px;
    display: flex; align-items: center; justify-content: center;
  }
  .modal-close:hover { background: #ff3b30; color: white; border-color: transparent; }
</style>
</head>
<body>

<div class="header">
  <div>
    <h1>Trading Dashboard</h1>
    <div class="header-sub" id="lastUpdate">Wird geladen...</div>
  </div>
  <div class="header-right">
    <div class="live"><div class="live-dot"></div>Live</div>
    <button class="btn" onclick="loadData()">↻ Aktualisieren</button>
  </div>
</div>

<div class="container">

  <div class="stats" id="stats"></div>

  <!-- Equity -->
  <div class="card">
    <div class="card-header">
      <div class="card-title">Equity Kurve</div>
      <div class="tabs" id="filterTabs">
        <div class="tab" onclick="setFilter('1D',this)">1D</div>
        <div class="tab on" onclick="setFilter('7D',this)">7D</div>
        <div class="tab" onclick="setFilter('30D',this)">30D</div>
        <div class="tab" onclick="setFilter('90D',this)">90D</div>
      </div>
    </div>
    <div class="type-tabs">
      <div class="type-tab on" onclick="setType('pnl',this)">PnL Entwicklung</div>
      <div class="type-tab" onclick="setType('balance',this)">Kontostand</div>
    </div>
    <div class="chart-wrap"><canvas id="eqChart"></canvas></div>
  </div>

  <!-- Calendar -->
  <div class="card">
    <div class="card-header">
      <div class="card-title">Kalender</div>
      <div class="cal-nav">
        <button class="cal-nav-btn" onclick="changeMonth(-1)">‹</button>
        <div class="cal-month-lbl" id="calLbl"></div>
        <button class="cal-nav-btn" onclick="changeMonth(1)">›</button>
      </div>
    </div>
    <div class="cal-grid" id="calGrid"></div>
  </div>

  <!-- Positions -->
  <div class="card">
    <div class="card-header">
      <div class="card-title">Offene Positionen</div>
      <span style="font-size:12px;color:#6e6e73;" id="posCount"></span>
    </div>
    <div id="positions"></div>
  </div>

  <!-- History -->
  <div class="card">
    <div class="card-header">
      <div class="card-title">Trade History</div>
      <span style="font-size:12px;color:#6e6e73;" id="tradeCount"></span>
    </div>
    <div id="history"></div>
  </div>

  <!-- Awards -->
  <div class="card">
    <div class="card-header"><div class="card-title">Best & Worst Trades</div></div>
    <div class="awards" id="awards"></div>
  </div>

</div>

<!-- Day Modal -->
<div class="overlay" id="dayModal" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div class="modal-title" id="modalTitle"></div>
    <div id="modalBody"></div>
  </div>
</div>

<script>
let trades=[], positions=[], balance={}, stats={};
let filter='7D', chartType='pnl', eqChart=null;
let calY=new Date().getFullYear(), calM=new Date().getMonth();

async function loadData() {
  try {
    const [s,p,t,b] = await Promise.all([
      fetch('/api/stats').then(r=>r.json()),
      fetch('/api/positions').then(r=>r.json()),
      fetch('/api/trades').then(r=>r.json()),
      fetch('/api/balance').then(r=>r.json())
    ]);
    stats=s; positions=p; trades=t; balance=b;
    document.getElementById('lastUpdate').textContent = 'Zuletzt: '+new Date().toLocaleString('de-DE');
    renderStats(); renderChart(); renderCalendar(); renderPositions(); renderHistory(); renderAwards();
  } catch(e){ console.error(e); }
}

function renderStats() {
  const up = positions.reduce((s,p)=>s+parseFloat(p.unrealizedPL||0),0);
  const bal = parseFloat(balance.accountEquity||0);
  const rl = parseFloat(stats.totalPnl||0);
  const avail = parseFloat(balance.available||0);
  document.getElementById('stats').innerHTML = `
    <div class="stat"><div class="stat-lbl">Balance</div><div class="stat-val b">$${bal.toFixed(2)}</div><div class="stat-sub">Verfügbar $${avail.toFixed(2)}</div></div>
    <div class="stat"><div class="stat-lbl">Unrealis. PnL</div><div class="stat-val ${up>=0?'g':'r'}">${up>=0?'+':''}$${up.toFixed(2)}</div></div>
    <div class="stat"><div class="stat-lbl">Realis. PnL</div><div class="stat-val ${rl>=0?'g':'r'}">${rl>=0?'+':''}$${rl.toFixed(2)}</div></div>
    <div class="stat"><div class="stat-lbl">Winrate</div><div class="stat-val">${stats.total>0?stats.rate+'%':'—'}</div><div class="stat-sub">${stats.wins||0}W / ${stats.losses||0}L</div></div>
    <div class="stat"><div class="stat-lbl">Trades</div><div class="stat-val">${stats.total||0}</div></div>
    <div class="stat"><div class="stat-lbl">Offen</div><div class="stat-val">${positions.length}</div></div>
  `;
}

function setFilter(f, btn) {
  filter=f;
  document.querySelectorAll('#filterTabs .tab').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  renderChart();
}

function setType(t, btn) {
  chartType=t;
  document.querySelectorAll('.type-tab').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  renderChart();
}

function renderChart() {
  const closed = trades.filter(t=>t.status==='closed'&&t.closeTime);
  const days = filter==='1D'?1:filter==='7D'?7:filter==='30D'?30:90;
  const start = new Date(Date.now()-days*86400000);
  const filtered = closed.filter(t=>new Date(t.closeTime)>=start).sort((a,b)=>new Date(a.closeTime)-new Date(b.closeTime));

  let labels, data;
  if (chartType==='pnl') {
    let cum=0; labels=['Start']; data=[0];
    for(const t of filtered){ cum+=t.pnl||0; labels.push(new Date(t.closeTime).toLocaleDateString('de-DE',{month:'short',day:'numeric'})); data.push(+cum.toFixed(2)); }
  } else {
    const rl=parseFloat(stats.totalPnl||0), bal=parseFloat(balance.accountEquity||0);
    let sb=bal-rl, cum=0; labels=['Start']; data=[+sb.toFixed(2)];
    for(const t of filtered){ cum+=t.pnl||0; labels.push(new Date(t.closeTime).toLocaleDateString('de-DE',{month:'short',day:'numeric'})); data.push(+(sb+cum).toFixed(2)); }
  }

  const up = data.length<2||data[data.length-1]>=data[0];
  const lc = up?'#34c759':'#ff3b30';

  if(eqChart) eqChart.destroy();
  const ctx=document.getElementById('eqChart').getContext('2d');
  const grad=ctx.createLinearGradient(0,0,0,200);
  grad.addColorStop(0, up?'rgba(52,199,89,0.15)':'rgba(255,59,48,0.12)');
  grad.addColorStop(1,'rgba(255,255,255,0)');

  eqChart = new Chart(ctx, {
    type:'line',
    data:{ labels, datasets:[{ data, borderColor:lc, backgroundColor:grad, borderWidth:2, fill:true, tension:0.4, pointRadius:data.length>20?0:4, pointHoverRadius:6, pointBackgroundColor:lc, pointBorderColor:'white', pointBorderWidth:2 }] },
    options:{
      responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{display:false}, tooltip:{ backgroundColor:'rgba(29,29,31,0.9)', titleColor:'#fff', bodyColor:'#aeaeb2', borderColor:lc, borderWidth:1, padding:10, callbacks:{ label:c=>`$${c.raw}` } } },
      scales:{
        x:{ grid:{display:false}, ticks:{color:'#6e6e73', font:{size:11}, maxTicksLimit:8} },
        y:{ grid:{color:'rgba(0,0,0,0.04)'}, ticks:{color:'#6e6e73', font:{size:11}, callback:v=>'$'+v} }
      },
      interaction:{intersect:false, mode:'index'}
    }
  });
}

function changeMonth(d) {
  calM+=d;
  if(calM<0){calM=11;calY--;} if(calM>11){calM=0;calY++;}
  renderCalendar();
}

function renderCalendar() {
  const mn=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
  document.getElementById('calLbl').textContent=mn[calM]+' '+calY;

  const dm={};
  for(const t of trades){
    const dt=t.status==='closed'?t.closeTime:null;
    if(!dt) continue;
    const d=new Date(dt);
    if(d.getFullYear()!==calY||d.getMonth()!==calM) continue;
    const k=d.getDate(); dm[k]=(dm[k]||0)+(t.pnl||0);
  }

  const first=new Date(calY,calM,1).getDay(), dim=new Date(calY,calM+1,0).getDate();
  const today=new Date(), isCur=today.getFullYear()===calY&&today.getMonth()===calM;
  const off=first===0?6:first-1;

  let html=['Mo','Di','Mi','Do','Fr','Sa','So'].map(d=>`<div class="cal-hdr">${d}</div>`).join('');
  for(let i=0;i<off;i++) html+=`<div class="cal-day empty"></div>`;
  for(let day=1;day<=dim;day++){
    const pnl=dm[day]; const isT=isCur&&today.getDate()===day;
    let cls='cal-day'; if(isT) cls+=' today'; if(pnl!==undefined) cls+=pnl>=0?' win':' loss';
    const ph=pnl!==undefined?`<div class="day-pnl">${pnl>=0?'+':''}$${Math.abs(pnl).toFixed(0)}</div>`:'';
    html+=`<div class="${cls}" onclick="showDay(${day})"><div class="day-num">${day}</div>${ph}</div>`;
  }
  document.getElementById('calGrid').innerHTML=html;
}

function showDay(day) {
  const dt=trades.filter(t=>{
    if(!t.closeTime) return false;
    const d=new Date(t.closeTime);
    return d.getFullYear()===calY&&d.getMonth()===calM&&d.getDate()===day;
  });
  if(!dt.length) return;
  const pnl=dt.reduce((s,t)=>s+(t.pnl||0),0);
  document.getElementById('modalTitle').textContent=`${day}. ${['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'][calM]} ${calY}`;
  document.getElementById('modalBody').innerHTML=`
    <div style="display:flex;gap:20px;margin-bottom:14px;">
      <div><div class="info-lbl">Trades</div><div class="info-val">${dt.length}</div></div>
      <div><div class="info-lbl">PnL</div><div class="info-val" style="color:${pnl>=0?'#34c759':'#ff3b30'};">${pnl>=0?'+':''}$${pnl.toFixed(2)}</div></div>
    </div>
    ${dt.map(t=>`<div style="border:1px solid #e5e5e7;border-radius:10px;padding:10px 12px;margin-bottom:8px;">
      <div style="display:flex;justify-content:space-between;">
        <b>${t.asset}</b>
        <span style="color:${t.pnl>=0?'#34c759':'#ff3b30'};font-weight:700;">${t.pnl>=0?'+':''}$${t.pnl.toFixed(2)}</span>
      </div>
      <div style="font-size:11px;color:#6e6e73;margin-top:4px;">${t.direction} · Entry $${t.entry} · ${t.closeReason||'—'}</div>
    </div>`).join('')}
  `;
  document.getElementById('dayModal').classList.add('show');
}

function closeModal() { document.getElementById('dayModal').classList.remove('show'); }

function renderPositions() {
  document.getElementById('posCount').textContent=positions.length+' offen';
  if(!positions.length){ document.getElementById('positions').innerHTML='<div class="empty">Keine offenen Positionen</div>'; return; }
  document.getElementById('positions').innerHTML=positions.map((p,i)=>{
    const pnl=parseFloat(p.unrealizedPL||0);
    const realized=parseFloat(p.achievedProfits||0);
    const isLong=p.holdSide==='long';
    const t=trades.find(t=>t.asset===p.symbol.replace('USDT','')&&t.status==='open');
    const tpList=t?.targets?.length?t.targets.map((tp,j)=>`TP${j+1}: $${tp.price}`).join(' · '):'—';
    const slVal=t?.stopLoss?`$${t.stopLoss}`:'—';
    return `<div class="pos-item" id="pos${i}">
      <div class="pos-top" onclick="togglePos(${i})">
        <div class="pos-left">
          <div class="pos-name">${p.symbol}</div>
          <div class="dir-tag ${isLong?'long':'short'}">${isLong?'Long':'Short'}</div>
        </div>
        <div style="display:flex;align-items:center;gap:12px;">
          <div class="pos-pnl ${pnl>=0?'g':'r'}">${pnl>=0?'+':''}$${pnl.toFixed(2)}</div>
          <div class="chevron">▼</div>
        </div>
      </div>
      <div class="pos-body">
        <div class="pos-grid">
          <div><div class="pos-meta-lbl">Entry</div><div class="pos-meta-val">$${parseFloat(p.openPriceAvg).toFixed(4)}</div></div>
          <div><div class="pos-meta-lbl">Size</div><div class="pos-meta-val">${p.total}</div></div>
          <div><div class="pos-meta-lbl">Stop Loss</div><div class="pos-meta-val" style="color:#ff3b30;">${slVal}</div></div>
          <div><div class="pos-meta-lbl">Take Profits</div><div class="pos-meta-val" style="font-size:11px;">${tpList}</div></div>
          <div><div class="pos-meta-lbl">Unrealisiert</div><div class="pos-meta-val" style="color:${pnl>=0?'#34c759':'#ff3b30'};">${pnl>=0?'+':''}$${pnl.toFixed(2)}</div></div>
          <div><div class="pos-meta-lbl">Realisiert</div><div class="pos-meta-val" style="color:${realized>=0?'#34c759':'#ff3b30'};">${realized>=0?'+':''}$${realized.toFixed(2)}</div></div>
        </div>
      </div>
    </div>`;
  }).join('');
}

function togglePos(i){ document.getElementById('pos'+i).classList.toggle('open'); }

function renderHistory() {
  const open=trades.filter(t=>t.status==='open');
  const closed=trades.filter(t=>t.status==='closed').slice(-40).reverse();
  const all=[...open,...closed];
  document.getElementById('tradeCount').textContent=all.length+' Trades';
  if(!all.length){ document.getElementById('history').innerHTML='<div class="empty">Keine Trades</div>'; return; }
  const eDot=e=>e.type.includes('TP')?'tp':e.type==='SL'?'sl':e.type.includes('BE')?'be':'def';
  document.getElementById('history').innerHTML=all.map((t,i)=>{
    const sc=t.status==='open'?'open':t.pnl>0?'win':'loss';
    const sl=t.status==='open'?'Offen':t.pnl>0?'Win':'Loss';
    const evHtml=t.events?.length?`<div class="events"><div class="events-lbl">Events</div>${t.events.map(e=>`<div class="event"><div class="e-dot ${eDot(e)}"></div><div class="e-type">${e.type}</div><div class="e-price">@ $${e.price}</div><div class="e-pnl ${(e.pnl||0)>=0?'g':'r'}">${(e.pnl||0)>=0?'+':''}$${(e.pnl||0).toFixed(2)}</div><div class="e-time">${new Date(e.time).toLocaleString('de-DE',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})}</div></div>`).join('')}</div>`:'';
    return `<div class="trade-item" id="tr${i}">
      <div class="trade-top" onclick="toggleTrade(${i})">
        <div class="trade-left">
          <div class="trade-name">${t.asset}</div>
          <div class="tag ${t.direction==='Long'?'long':'short'}">${t.direction}</div>
          <div class="tag ${sc}">${sl}</div>
        </div>
        <div class="trade-right">
          <div class="trade-pnl ${t.pnl>=0?'g':'r'}">${t.pnl>=0?'+':''}$${t.pnl.toFixed(2)}</div>
          <div class="chevron">▼</div>
        </div>
      </div>
      <div class="trade-body">
        <div class="info-grid">
          <div><div class="info-lbl">Entry</div><div class="info-val">$${t.entry}</div></div>
          <div><div class="info-lbl">Stop Loss</div><div class="info-val" style="color:#ff3b30;">$${t.stopLoss}</div></div>
          <div><div class="info-lbl">Take Profits</div><div class="info-val" style="font-size:12px;">${t.targets?.map((tp,j)=>`TP${j+1}: $${tp.price}`).join('<br>')||'—'}</div></div>
          <div><div class="info-lbl">PnL</div><div class="info-val" style="color:${t.pnl>=0?'#34c759':'#ff3b30'};">${t.pnl>=0?'+':''}$${t.pnl.toFixed(2)}</div></div>
          <div><div class="info-lbl">Geöffnet</div><div class="info-val">${new Date(t.openTime).toLocaleString('de-DE',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})}</div></div>
          <div><div class="info-lbl">Geschlossen</div><div class="info-val">${t.closeTime?new Date(t.closeTime).toLocaleString('de-DE',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}):'—'}</div></div>
          ${t.closeReason?`<div><div class="info-lbl">Grund</div><div class="info-val">${t.closeReason}</div></div>`:''}
        </div>
        ${evHtml}
      </div>
    </div>`;
  }).join('');
}

function toggleTrade(i){ document.getElementById('tr'+i).classList.toggle('open'); }

function renderAwards() {
  const closed=trades.filter(t=>t.status==='closed');
  if(!closed.length){ document.getElementById('awards').innerHTML='<div class="empty" style="grid-column:1/-1">Noch keine geschlossenen Trades</div>'; return; }
  const sorted=[...closed].sort((a,b)=>b.pnl-a.pnl);
  const best=sorted[0], second=sorted[1], worst=sorted[sorted.length-1];
  const avg=closed.reduce((s,t)=>s+t.pnl,0)/closed.length;
  document.getElementById('awards').innerHTML=`
    ${best?`<div class="award gold"><div class="award-icon">🥇</div><div class="award-lbl">Bester Trade</div><div class="award-name">${best.asset}</div><div class="award-val g">+$${best.pnl.toFixed(2)}</div><div class="award-meta">${best.direction} · ${new Date(best.openTime).toLocaleDateString('de-DE')}</div></div>`:''}
    ${second?`<div class="award silver"><div class="award-icon">🥈</div><div class="award-lbl">Zweitbester</div><div class="award-name">${second.asset}</div><div class="award-val g">+$${second.pnl.toFixed(2)}</div><div class="award-meta">${second.direction} · ${new Date(second.openTime).toLocaleDateString('de-DE')}</div></div>`:''}
    ${worst?`<div class="award worst"><div class="award-icon">📉</div><div class="award-lbl">Größter Verlust</div><div class="award-name">${worst.asset}</div><div class="award-val r">$${worst.pnl.toFixed(2)}</div><div class="award-meta">${worst.direction} · ${new Date(worst.openTime).toLocaleDateString('de-DE')}</div></div>`:''}
    <div class="award avg"><div class="award-icon">📊</div><div class="award-lbl">Ø PnL / Trade</div><div class="award-name" style="font-size:18px;">${avg>=0?'+':''}$${avg.toFixed(2)}</div><div class="award-val b">${closed.length} Trades</div></div>
  `;
}

loadData();
setInterval(loadData, 30000);
</script>
</body>
</html>
